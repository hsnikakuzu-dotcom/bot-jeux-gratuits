name: Jeux gratuits

on:
  schedule:
    # Toutes les 30 minutes. L'ancien "*/40" ne donnait pas un intervalle regulier :
    # il se declenchait aux minutes 0 et 40, soit 40 min puis 20 min.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeux-gratuits
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Publier les nouveautes sur Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GAMES_CHANNEL_ID: ${{ secrets.GAMES_CHANNEL_ID }}
          UPCOMING_CHANNEL_ID: ${{ secrets.UPCOMING_CHANNEL_ID }}
          NEWS_CHANNEL_ID: ${{ secrets.NEWS_CHANNEL_ID }}
          PING_ROLE_ID: ${{ secrets.PING_ROLE_ID }}
          MIN_REVIEWS: ${{ vars.MIN_REVIEWS }}
          PING_MIN_REVIEWS: ${{ vars.PING_MIN_REVIEWS }}
          PLATFORMS: ${{ vars.PLATFORMS }}
          COMMUNITY_SOURCES: ${{ vars.COMMUNITY_SOURCES }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
        run: python bot.py --once

      - name: Memoriser ce qui a ete publie
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in posted.json steam_cache.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour des publications"
          # Une execution manuelle lancee en meme temps peut avoir pousse avant nous
          git pull --rebase --autostash || true
          git push
